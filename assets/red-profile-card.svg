<svg width="1200" height="1120" viewBox="0 0 1200 1120" fill="none" xmlns="http://www.w3.org/2000/svg">

<style>
@keyframes glow {
  0%,100% {
    filter:drop-shadow(0 0 3px #ff0033) drop-shadow(0 0 8px #ff0033);
    opacity:.96;
  }
  50% {
    filter:drop-shadow(0 0 5px #ff0033) drop-shadow(0 0 12px #ff0033);
    opacity:1;
  }
}

@keyframes scan {
  0% {
    transform:translateY(-70px);
    opacity:0;
  }
  20% {
    opacity:.18;
  }
  100% {
    transform:translateY(1170px);
    opacity:0;
  }
}

@keyframes move {
  0% {
    transform:translateY(-1120px);
    opacity:.04;
  }
  50% {
    opacity:.18;
  }
  100% {
    transform:translateY(1120px);
    opacity:.04;
  }
}

@keyframes dash {
  to {
    stroke-dashoffset:-180;
  }
}

.bg {
  fill:#030000;
}

.layer1 {
  fill:#080002;
  opacity:.98;
}

.layer2 {
  fill:#ff0033;
  opacity:.04;
}

.grid {
  stroke:#ff0033;
  stroke-width:1;
  opacity:.10;
}

.card {
  fill:#060001;
  stroke:#ff0033;
  stroke-width:2;
  animation:glow 3s ease-in-out infinite;
}

.panel {
  fill:#120005;
  stroke:#ff0033;
  stroke-width:1.2;
}

.title {
  font-family:"Arial Black","Impact","Courier New",monospace;
  font-size:36px;
  font-weight:900;
  fill:#ff0033;
  letter-spacing:2px;
  animation:glow 2.4s ease-in-out infinite;
}

.head {
  font-family:"Arial Black","Impact","Courier New",monospace;
  font-size:20px;
  font-weight:900;
  fill:#ff0033;
  letter-spacing:1px;
}

.text {
  font-family:"Courier New",monospace;
  font-size:18px;
  fill:#ff0033;
  font-weight:900;
}

.small {
  font-family:"Courier New",monospace;
  font-size:16px;
  fill:#ff0033;
  font-weight:900;
}

.muted {
  font-family:"Courier New",monospace;
  font-size:17px;
  fill:#ff0033;
  font-weight:900;
}

.barbg {
  fill:#160006;
  stroke:#ff0033;
  stroke-width:1;
  opacity:.65;
}

.bar {
  fill:#ff0033;
  filter:drop-shadow(0 0 3px #ff0033);
}

.matrix {
  font-family:"Courier New",monospace;
  font-size:17px;
  fill:#ff0033;
  opacity:.22;
  animation:move 9s linear infinite;
}

.matrix2 {
  animation-delay:3s;
  opacity:.14;
}

.scan {
  fill:#ff0033;
  opacity:.10;
  animation:scan 4s linear infinite;
}

.dash {
  stroke:#ff0033;
  stroke-width:2;
  stroke-dasharray:16 10;
  animation:dash 5s linear infinite;
  opacity:.35;
}

.pill {
  fill:#100004;
  stroke:#ff0033;
  stroke-width:1;
}

.pillText {
  font-family:"Arial Black","Impact","Courier New",monospace;
  font-size:13px;
  font-weight:900;
  fill:#ff0033;
  letter-spacing:.4px;
}
</style>


